[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-deepseek-subagent-setup"
version = "0.1.0"
description = "Cross-platform idempotent installer for the Codex DeepSeek V4 Flash worker (agent, skill, Hook, config, AGENTS.md)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daqi Hu" }]
keywords = ["codex", "deepseek", "subagent", "installer", "hooks"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
codex-deepseek-subagent-setup = "codex_deepseek_subagent_setup:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = ["codex_deepseek_subagent_setup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
